<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep The Flow — Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-navy: #0f1a30;
            --navy-light: #1a2744;
            --navy-lighter: #2a3a5e;
            --gold: #c5a44e;
            --gold-light: #d4b86a;
            --text-main: #e8e6e3;
            --text-dim: #8a95a8;
            --correct: #10B981;
            --correct-bg: rgba(16, 185, 129, 0.1);
            --incorrect: #EF4444;
            --incorrect-bg: rgba(239, 68, 68, 0.1);
            --font-ui: 'Inter', sans-serif;
            --font-arabic: 'Amiri', serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-ui);
            background-color: var(--bg-navy);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(197,164,78,0.05) 0%, transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(42,58,94,0.3) 0%, transparent 50%);
            overflow: hidden;
        }
        .container {
            width: 100%; max-width: 800px;
            background: rgba(42,58,94,0.5);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(197,164,78,0.1);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            position: relative; overflow: hidden;
            transition: border-color 0.5s, box-shadow 0.5s;
            z-index: 1;
        }

        /* Streak banner overlay */
        #streak-banner {
            position: fixed; top: 0; left: 0; right: 0;
            display: none; justify-content: center; align-items: center;
            z-index: 100; pointer-events: none;
            padding: 16px; text-align: center;
        }
        .streak-inner {
            padding: 12px 32px; border-radius: 16px;
            font-weight: 800; font-size: 20px; letter-spacing: 1px;
            text-transform: uppercase;
            animation: streakSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .streak-correct {
            background: linear-gradient(135deg, rgba(16,185,129,0.95), rgba(5,150,105,0.95));
            color: #fff; box-shadow: 0 8px 32px rgba(16,185,129,0.4);
        }
        .streak-wrong {
            background: linear-gradient(135deg, rgba(239,68,68,0.95), rgba(185,28,28,0.95));
            color: #fff; box-shadow: 0 8px 32px rgba(239,68,68,0.4);
        }
        @keyframes streakSlide {
            0% { transform: translateY(-100%) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* Particle canvas */
        #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

        /* Screen shake */
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
        @keyframes shakeHard { 0%,100%{transform:translateX(0)} 10%{transform:translate(-12px,-4px)} 30%{transform:translate(10px,6px)} 50%{transform:translate(-14px,2px)} 70%{transform:translate(8px,-8px)} 90%{transform:translate(-6px,4px)} }
        .shake { animation: shake 0.4s ease; }
        .shake-hard { animation: shakeHard 0.6s ease; }

        /* Glow effects on container */
        .glow-correct { border-color: var(--correct) !important; box-shadow: 0 0 40px rgba(16,185,129,0.3), 0 0 80px rgba(16,185,129,0.1) !important; }
        .glow-correct-intense { border-color: #34d399 !important; box-shadow: 0 0 60px rgba(16,185,129,0.5), 0 0 120px rgba(16,185,129,0.2), inset 0 0 30px rgba(16,185,129,0.05) !important; }
        .glow-wrong { border-color: var(--incorrect) !important; box-shadow: 0 0 40px rgba(239,68,68,0.3), 0 0 80px rgba(239,68,68,0.1) !important; }
        .glow-wrong-intense { border-color: #f87171 !important; box-shadow: 0 0 60px rgba(239,68,68,0.5), 0 0 120px rgba(239,68,68,0.2), inset 0 0 30px rgba(239,68,68,0.05) !important; }

        /* Streak counter pill */
        #streak-counter {
            position: absolute; top: 16px; right: 16px;
            padding: 6px 14px; border-radius: 20px;
            font-weight: 700; font-size: 14px;
            display: none; z-index: 10;
            transition: all 0.3s;
        }
        .streak-counter-correct { background: rgba(16,185,129,0.2); color: var(--correct); border: 1px solid rgba(16,185,129,0.3); }
        .streak-counter-wrong { background: rgba(239,68,68,0.2); color: var(--incorrect); border: 1px solid rgba(239,68,68,0.3); }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn {
            background: none; border: none; color: var(--text-dim);
            font-family: var(--font-ui); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            transition: color 0.2s; text-decoration: none;
        }
        .back-btn:hover { color: var(--gold); }

        /* Progress */
        .progress-container { width: 100%; height: 8px; background: var(--navy-light); border-radius: 4px; margin-bottom: 40px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--gold); width: 0%; transition: width 0.3s ease; border-radius: 4px; }

        /* Screens */
        #loading-screen, #error-screen, #completed-screen, #quiz-screen, #results-screen {
            display: none; animation: fadeIn 0.5s ease;
        }
        #loading-screen { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 60px 0; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(197,164,78,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }

        /* Quiz */
        .meta-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tier-badge { background: var(--navy-light); color: var(--gold); padding: 4px 12px; border-radius: 9999px; font-size: 14px; font-weight: 500; border: 1px solid rgba(197,164,78,0.2); }
        .question-counter { color: var(--text-dim); font-size: 14px; font-weight: 500; }
        .question-text { font-size: 24px; font-weight: 600; margin-bottom: 30px; line-height: 1.4; }
        .options-grid { display: flex; flex-direction: column; gap: 16px; }
        .option-btn {
            background: rgba(42,58,94,0.6); border: 2px solid transparent; border-radius: 16px; padding: 20px;
            color: var(--text-main); font-family: var(--font-ui); font-size: 16px; text-align: left;
            cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;
        }
        .option-btn:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); }
        .option-btn:disabled { cursor: not-allowed; opacity: 0.8; }
        .option-btn.correct { border-color: var(--correct); background: var(--correct-bg); }
        .option-btn.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }

        /* Feedback */
        .feedback-area { margin-top: 30px; padding: 20px; border-radius: 12px; display: none; animation: slideIn 0.3s ease; background: rgba(255,255,255,0.05); border-left: 4px solid var(--gold); }
        .feedback-area.correct { border-left-color: var(--correct); background: var(--correct-bg); }
        .feedback-area.incorrect { border-left-color: var(--incorrect); background: var(--incorrect-bg); }
        .feedback-title { font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .feedback-area.correct .feedback-title { color: var(--correct); }
        .feedback-area.incorrect .feedback-title { color: var(--incorrect); }
        .feedback-text { color: var(--text-main); line-height: 1.5; margin-bottom: 20px; }
        .continue-btn { background: var(--gold); color: var(--bg-navy); border: none; padding: 12px 24px; border-radius: 8px; font-family: var(--font-ui); font-weight: 600; font-size: 16px; cursor: pointer; transition: background 0.2s; float: right; }
        .continue-btn:hover { background: var(--gold-light); }
        .clearfix::after { content: ""; clear: both; display: table; }

        /* Results */
        .results-content { text-align: center; padding: 40px 0; }
        .score-circle-container { width: 200px; height: 200px; margin: 0 auto 30px; position: relative; }
        .score-circle { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(var(--gold) 0%, var(--navy-lighter) 0%); display: flex; align-items: center; justify-content: center; position: relative; transition: background 1.5s ease-out; }
        .score-circle::before { content: ""; position: absolute; inset: 10px; background: var(--bg-navy); border-radius: 50%; }
        .score-text-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
        .score-fraction { font-size: 40px; font-weight: 800; color: var(--text-main); }
        .score-percentage { font-size: 18px; color: var(--gold); font-weight: 600; }
        .results-message { font-size: 24px; font-weight: 600; margin-bottom: 16px; }
        .results-submessage { color: var(--text-dim); margin-bottom: 40px; font-size: 16px; }
        .primary-btn { background: var(--gold); color: var(--bg-navy); border: none; padding: 16px 32px; border-radius: 12px; font-family: var(--font-ui); font-weight: 700; font-size: 18px; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .primary-btn:hover { background: var(--gold-light); transform: translateY(-2px); }
        .message-box { text-align: center; padding: 40px; }
        .message-box h2 { margin-bottom: 16px; color: var(--gold); }
        .message-box p { color: var(--text-dim); margin-bottom: 24px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .arabic { font-family: var(--font-arabic); direction: rtl; }
    </style>
</head>
<body>

    <canvas id="particles"></canvas>

    <div id="streak-banner"><div class="streak-inner" id="streak-inner"></div></div>

    <div class="container" id="main-container">
        <div id="streak-counter"></div>

        <div id="loading-screen"><div class="spinner"></div><p>Loading Quiz...</p></div>
        <div id="error-screen" class="message-box"><h2>Error</h2><p id="error-message">Could not load the quiz.</p><a href="/qm/" class="primary-btn">Return to QuizMe</a></div>
        <div id="completed-screen" class="message-box"><h2>Quiz Already Completed</h2><p id="completed-message">You have already taken this quiz.</p><button onclick="startQuiz(true)" class="primary-btn">Retake Quiz</button><br><br><a href="/qm/" style="color:var(--text-dim);text-decoration:underline;">Back to QuizMe</a></div>

        <div id="quiz-screen">
            <div class="header">
                <a href="/qm/" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>QuizMe</a>
                <h3 id="quiz-title-display" style="color:var(--gold);margin:0;font-size:16px;">Quiz</h3>
            </div>
            <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
            <div class="meta-info"><span class="tier-badge" id="question-tier">Tier</span><span class="question-counter" id="question-counter">Question 1 of X</span></div>
            <h2 class="question-text" id="question-text"></h2>
            <div class="options-grid" id="options-grid"></div>
            <div class="feedback-area clearfix" id="feedback-area">
                <div class="feedback-title" id="feedback-title"></div>
                <div class="feedback-text" id="feedback-text"></div>
                <button class="continue-btn" onclick="nextQuestion()">Continue &rarr;</button>
            </div>
        </div>

        <div id="results-screen">
            <div class="header" style="justify-content:center;"><h2 style="color:var(--gold);margin:0;">Quiz Complete</h2></div>
            <div class="results-content">
                <div class="score-circle-container"><div class="score-circle" id="score-circle"><div class="score-text-inner"><span class="score-fraction" id="score-fraction">0/0</span><span class="score-percentage" id="score-percentage">0%</span></div></div></div>
                <h3 class="results-message" id="results-message">Outstanding!</h3>
                <p class="results-submessage" id="results-submessage">Score saved successfully.</p>
                <a href="/qm/" class="primary-btn">&larr; Back to QuizMe</a>
            </div>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const SUPABASE_URL = 'https://lhebavvnrwqojbhyodwc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JW75ayCf5SbvyT-02GmjNQ_vFpivPTU';
        const REST = SUPABASE_URL + '/rest/v1/';
        function dbHeaders() { return { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' }; }
        function dbSelect(table, filters) { var qs='select=*'; for(var k in filters) qs+='&'+k+'=eq.'+encodeURIComponent(filters[k]); return fetch(REST+table+'?'+qs,{method:'GET',headers:dbHeaders()}).then(r=>r.json()); }
        function dbInsert(table, row) { return fetch(REST+table,{method:'POST',headers:dbHeaders(),body:JSON.stringify(row)}).then(r=>{if(!r.ok) return r.json().then(e=>{throw new Error(e.message);}); return r.json();}); }
        function dbUpdate(table, id, data) { return fetch(REST+table+'?id=eq.'+id,{method:'PATCH',headers:dbHeaders(),body:JSON.stringify(data)}).then(r=>{if(!r.ok) return r.json().then(e=>{throw new Error(e.message);}); return r.json();}); }

        // ===== AUDIO TRACKS =====
        const CORRECT_AUDIO = ['audio/correct1.m4a','audio/correct2.m4a','audio/correct3.m4a','audio/correct4.m4a','audio/correct5.m4a'];
        const WRONG_AUDIO = ['audio/wrong1.m4a','audio/wrong2.m4a'];
        const CORRECT_LABELS = ['Subhanallah!','Alhamdulillah!','La ilaha illallah!','Allahu Akbar!','La hawla wa la quwwata illa billah!'];
        const WRONG_LABELS = ['Astaghfirullah!','A\'udhu billahi min al-Shaytan ir-rajim!'];

        // ===== STATE =====
        let quizDef = null, quizQuestions = [], currentQuestionIndex = 0, score = 0;
        let studentName = '', quizId = '', previousScoreRecord = null;
        let correctStreak = 0, wrongStreak = 0;
        let currentAudio = null;

        const screens = {
            loading: document.getElementById('loading-screen'),
            error: document.getElementById('error-screen'),
            completed: document.getElementById('completed-screen'),
            quiz: document.getElementById('quiz-screen'),
            results: document.getElementById('results-screen')
        };

        // ===== PARTICLE SYSTEM =====
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas(); window.addEventListener('resize', resizeCanvas);

        function spawnParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
                const speed = 3 + Math.random() * 6;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2,
                    life: 1,
                    decay: 0.015 + Math.random() * 0.02,
                    size: 3 + Math.random() * 5,
                    color
                });
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life -= p.decay;
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            if (particles.length > 0) requestAnimationFrame(animateParticles);
        }

        function burstEffect(isCorrect, streakCount) {
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const colors = isCorrect
                ? ['#10B981', '#34d399', '#6ee7b7', '#c5a44e', '#fbbf24']
                : ['#EF4444', '#f87171', '#fca5a5', '#dc2626'];
            const count = Math.min(streakCount * 15, 80);
            colors.forEach(c => spawnParticles(cx + (Math.random()-0.5)*200, cy + (Math.random()-0.5)*100, c, count / colors.length));
            requestAnimationFrame(animateParticles);
        }

        // ===== STREAK VISUALS =====
        function showStreakBanner(isCorrect, streak) {
            const banner = document.getElementById('streak-banner');
            const inner = document.getElementById('streak-inner');
            const container = document.getElementById('main-container');
            const counter = document.getElementById('streak-counter');

            // Banner text
            if (isCorrect) {
                const label = CORRECT_LABELS[(streak - 1) % CORRECT_LABELS.length];
                let prefix = '';
                if (streak >= 5) prefix = '🔥🔥🔥 LEGENDARY! ';
                else if (streak >= 4) prefix = '🔥🔥 ON FIRE! ';
                else if (streak >= 3) prefix = '🔥 HOT STREAK! ';
                else if (streak >= 2) prefix = '⚡ STREAK! ';
                inner.textContent = prefix + label;
                inner.className = 'streak-inner streak-correct';
                inner.style.fontSize = Math.min(20 + streak * 3, 36) + 'px';

                // Container glow
                container.classList.remove('glow-wrong', 'glow-wrong-intense', 'glow-correct', 'glow-correct-intense');
                container.classList.add(streak >= 3 ? 'glow-correct-intense' : 'glow-correct');

                // Counter
                counter.textContent = '🔥 ' + streak + 'x Streak';
                counter.className = 'streak-counter-correct';
                counter.style.display = streak >= 2 ? 'block' : 'none';
                counter.style.fontSize = Math.min(14 + streak, 22) + 'px';
            } else {
                const label = WRONG_LABELS[(streak - 1) % WRONG_LABELS.length];
                inner.textContent = (streak >= 2 ? '💔 ' : '') + label;
                inner.className = 'streak-inner streak-wrong';
                inner.style.fontSize = Math.min(20 + streak * 2, 30) + 'px';

                container.classList.remove('glow-correct', 'glow-correct-intense', 'glow-wrong', 'glow-wrong-intense');
                container.classList.add(streak >= 2 ? 'glow-wrong-intense' : 'glow-wrong');

                // Shake
                container.classList.remove('shake', 'shake-hard');
                void container.offsetWidth;
                container.classList.add(streak >= 2 ? 'shake-hard' : 'shake');

                counter.textContent = '💔 ' + streak + 'x Wrong';
                counter.className = 'streak-counter-wrong';
                counter.style.display = streak >= 2 ? 'block' : 'none';
            }

            // Show banner
            banner.style.display = 'flex';
            inner.style.animation = 'none';
            void inner.offsetWidth;
            inner.style.animation = 'streakSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';

            // Particles
            burstEffect(isCorrect, streak);

            // Auto-hide banner
            clearTimeout(banner._timer);
            banner._timer = setTimeout(() => { banner.style.display = 'none'; }, 2500);
        }

        // ===== AUDIO =====
        function playAudio(src) {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            currentAudio = new Audio(src);
            currentAudio.volume = 0.8;
            currentAudio.play().catch(() => {});
        }

        function playStreakAudio(isCorrect, streak) {
            if (isCorrect) {
                playAudio(CORRECT_AUDIO[(streak - 1) % CORRECT_AUDIO.length]);
            } else {
                playAudio(WRONG_AUDIO[(streak - 1) % WRONG_AUDIO.length]);
            }
        }

        // ===== INIT =====
        let isAdminPreview = false;
        async function init() {
            showScreen('loading');
            studentName = localStorage.getItem('qrasm_student_name');
            const urlParams = new URLSearchParams(window.location.search);
            const urlStudent = urlParams.get('student');
            quizId = urlParams.get('quizId');
            isAdminPreview = urlParams.get('admin') === 'true';

            // Admin preview mode: bypass student name check
            if (!isAdminPreview && (!studentName || studentName !== urlStudent)) { window.location.href = '/qm/'; return; }
            if (isAdminPreview && !studentName) studentName = 'Admin Preview';
            if (!quizId) { showError('No quiz ID provided.'); return; }

            try {
                const defUrl = REST + 'qrasm_recordings?select=*&assignment_id=eq.quizme&instance_number=eq.' + encodeURIComponent(quizId) + '&student_name=like.QUIZ_DEF_%25';
                const defRes = await fetch(defUrl, { method: 'GET', headers: dbHeaders() });
                const defData = await defRes.json();
                if (!defData || defData.length === 0) { showError('Quiz not found.'); return; }

                quizDef = defData[0];
                quizDef.parsedGrade = typeof quizDef.grade === 'string' ? JSON.parse(quizDef.grade) : quizDef.grade;

                // Admin preview: always start fresh, no score check
                if (isAdminPreview) {
                    startQuiz();
                } else {
                    const scoreData = await dbSelect('qrasm_recordings', { assignment_id: 'quizme', instance_number: quizId, student_name: 'QUIZ_SCORE_' + studentName });
                    if (scoreData && scoreData.length > 0) {
                        previousScoreRecord = scoreData[0];
                        document.getElementById('completed-message').innerText = 'You have already taken this quiz. Previous score: ' + previousScoreRecord.grade;
                        showScreen('completed');
                    } else {
                        startQuiz();
                    }
                }
            } catch (err) {
                console.error(err);
                showError('Failed to load quiz data: ' + err.message);
            }
        }

        function startQuiz(isRetake) {
            quizQuestions = [...quizDef.parsedGrade.questions];
            shuffleArray(quizQuestions);
            quizQuestions.forEach(q => {
                const options = [...q.options];
                const cIdx = (q.correctIndex !== undefined) ? q.correctIndex : (q.correctOptionIndex !== undefined ? q.correctOptionIndex : 0);
                const correctAnswer = options[cIdx];
                shuffleArray(options);
                q.shuffledOptions = options;
                q.newCorrectIndex = options.indexOf(correctAnswer);
            });
            currentQuestionIndex = 0; score = 0; correctStreak = 0; wrongStreak = 0;
            document.getElementById('quiz-title-display').innerText = quizDef.parsedGrade.title || 'Quiz';
            document.getElementById('streak-counter').style.display = 'none';
            document.getElementById('main-container').className = 'container';
            showScreen('quiz');
            renderQuestion();
        }

        function renderQuestion() {
            const q = quizQuestions[currentQuestionIndex];
            document.getElementById('progress-bar').style.width = ((currentQuestionIndex / quizQuestions.length) * 100) + '%';
            document.getElementById('question-tier').innerText = q.tier || 'General';
            document.getElementById('question-counter').innerText = 'Question ' + (currentQuestionIndex + 1) + ' of ' + quizQuestions.length;

            const qTextElem = document.getElementById('question-text');
            qTextElem.innerText = q.question || q.text;
            qTextElem.className = 'question-text' + (isArabic(q.question || q.text || '') ? ' arabic' : '');

            const optionsGrid = document.getElementById('options-grid');
            optionsGrid.innerHTML = '';
            q.shuffledOptions.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn' + (isArabic(opt) ? ' arabic' : '');
                btn.innerHTML = '<span>' + opt + '</span><span class="icon"></span>';
                btn.onclick = () => handleAnswer(idx);
                optionsGrid.appendChild(btn);
            });
            document.getElementById('feedback-area').style.display = 'none';
        }

        function handleAnswer(selectedIndex) {
            const q = quizQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === q.newCorrectIndex;

            if (isCorrect) {
                score++;
                correctStreak++;
                wrongStreak = 0;
                playStreakAudio(true, correctStreak);
                showStreakBanner(true, correctStreak);
            } else {
                wrongStreak++;
                correctStreak = 0;
                playStreakAudio(false, wrongStreak);
                showStreakBanner(false, wrongStreak);
            }

            // Disable buttons & show correct/wrong
            const btns = document.getElementById('options-grid').querySelectorAll('.option-btn');
            btns.forEach((btn, idx) => {
                btn.disabled = true;
                const iconSpan = btn.querySelector('.icon');
                if (idx === q.newCorrectIndex) {
                    btn.classList.add('correct');
                    iconSpan.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
                } else if (idx === selectedIndex && !isCorrect) {
                    btn.classList.add('incorrect');
                    iconSpan.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
                }
            });

            // Show feedback
            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.className = 'feedback-area clearfix ' + (isCorrect ? 'correct' : 'incorrect');
            if (isCorrect) {
                document.getElementById('feedback-title').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg> Correct!';
                document.getElementById('feedback-text').innerText = q.rationale || 'Great job!';
            } else {
                document.getElementById('feedback-title').innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Incorrect';
                document.getElementById('feedback-text').innerHTML = '<strong>Correct Answer:</strong> ' + q.shuffledOptions[q.newCorrectIndex] + '<br><br>' + (q.rationale || '');
            }
            feedbackArea.style.display = 'block';
            feedbackArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizQuestions.length) {
                const qs = document.getElementById('quiz-screen');
                qs.style.animation = 'none'; void qs.offsetHeight; qs.style.animation = 'fadeIn 0.5s ease';
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        async function finishQuiz() {
            showScreen('results');
            document.getElementById('main-container').className = 'container';
            document.getElementById('streak-counter').style.display = 'none';

            const total = quizQuestions.length;
            const pct = Math.round((score / total) * 100);

            document.getElementById('score-fraction').innerText = score + '/' + total;
            document.getElementById('score-percentage').innerText = pct + '%';
            setTimeout(() => { document.getElementById('score-circle').style.background = 'conic-gradient(var(--gold) ' + pct + '%, var(--navy-lighter) ' + pct + '%)'; }, 100);

            const msgEl = document.getElementById('results-message');
            if (pct >= 90) msgEl.innerText = "Outstanding! Ma sha Allah! 🌟";
            else if (pct >= 70) msgEl.innerText = "Great work! Keep it up! 💪";
            else if (pct >= 50) msgEl.innerText = "Good effort! Review and try again 📖";
            else msgEl.innerText = "Keep studying, you'll get there! 🤲";

            // Victory particles
            if (pct >= 70) {
                for (let i = 0; i < 5; i++) setTimeout(() => burstEffect(true, 5), i * 300);
            }

            // Save score (skip in admin preview mode)
            if (isAdminPreview) {
                document.getElementById('results-submessage').innerText = "Admin Preview — score not saved.";
            } else {
                try {
                    const gradeStr = score + '/' + total;
                    if (previousScoreRecord) {
                        await dbUpdate('qrasm_recordings', previousScoreRecord.id, { grade: gradeStr });
                    } else {
                        await dbInsert('qrasm_recordings', { student_name: 'QUIZ_SCORE_' + studentName, assignment_id: 'quizme', instance_number: quizId, grade: gradeStr, audio_url: quizDef.parsedGrade.title || 'quiz' });
                    }
                } catch (err) {
                    console.error('Error saving score:', err);
                    document.getElementById('results-submessage').innerText = "Note: Could not save score to database.";
                }
            }
        }

        // ===== HELPERS =====
        function showScreen(id) { Object.values(screens).forEach(s => s.style.display = 'none'); screens[id].style.display = (id === 'quiz' || id === 'results') ? 'block' : 'flex'; }
        function showError(msg) { document.getElementById('error-message').innerText = msg; showScreen('error'); }
        function shuffleArray(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } }
        function isArabic(text) { return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text); }

        // Start
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    </script>
</body>
</html>
