<!DOCTYPE html>
<html>
<head><title>Debug Student Progress</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family:monospace;padding:20px;background:#111;color:#0f0;">
<h2>Keep The Flow - Debug Page</h2>
<pre id="log"></pre>
<script>
function log(msg) {
    document.getElementById('log').textContent += new Date().toISOString().substr(11,8) + ' ' + msg + '\n';
    console.log(msg);
}

log('1. Page loaded');
log('2. window.supabase = ' + (typeof window.supabase));

const name = localStorage.getItem('qrasm_student_name');
log('3. localStorage qrasm_student_name = "' + name + '"');
log('4. localStorage qrasm_student_email = "' + localStorage.getItem('qrasm_student_email') + '"');

if (!window.supabase) {
    log('FATAL: Supabase library not loaded!');
} else {
    const sb = window.supabase.createClient(
        "https://lhebavvnrwqojbhyodwc.supabase.co",
        "sb_publishable_JW75ayCf5SbvyT-02GmjNQ_vFpivPTU"
    );
    log('5. Supabase client created OK');

    const assignmentId = 'idgham_yw_lesson';
    const studentName = name;

    if (!studentName) {
        log('6. No student name in localStorage - would show login overlay');
        log('   Try logging in at the dashboard first: https://keep-the-flow.vercel.app/');
    } else {
        log('6. Querying Supabase for: assignment_id=' + assignmentId + ', student_name IN ["' + studentName + '", "ADMIN_FEEDBACK_' + studentName + '"]');

        sb.from('qrasm_recordings').select('instance_number, grade, audio_url, student_name, created_at')
          .eq('assignment_id', assignmentId)
          .in('student_name', [studentName, 'ADMIN_FEEDBACK_' + studentName])
          .order('created_at', {ascending: false})
          .then(({data, error}) => {
              if (error) {
                  log('7. SUPABASE ERROR: ' + JSON.stringify(error));
              } else {
                  log('7. Query returned ' + (data ? data.length : 0) + ' rows');
                  if (data && data.length > 0) {
                      data.slice(0, 10).forEach((r, i) => {
                          log('   [' + i + '] instance=' + r.instance_number + ' grade=' + r.grade + ' name=' + r.student_name);
                      });
                  } else {
                      log('   NO DATA FOUND! This means the student name in localStorage does not match any recordings.');
                      log('   Checking ALL distinct students in this lesson...');
                      sb.from('qrasm_recordings').select('student_name')
                        .eq('assignment_id', assignmentId)
                        .not('student_name', 'like', 'EMAIL_SENT_%')
                        .not('student_name', 'like', 'ADMIN_HIDDEN%')
                        .not('student_name', 'like', 'SYSTEM%')
                        .then(({data: allData}) => {
                            const names = [...new Set((allData||[]).filter(r => !r.student_name.startsWith('ADMIN_FEEDBACK_')).map(r => r.student_name))];
                            log('   Students who have recordings: ' + JSON.stringify(names));
                            log('   Your localStorage name: "' + studentName + '"');
                            const match = names.find(n => n.toLowerCase() === studentName.toLowerCase());
                            if (match && match !== studentName) {
                                log('   CASE MISMATCH FOUND! DB has "' + match + '" but localStorage has "' + studentName + '"');
                            }
                        });
                  }
              }
          });
    }
}
</script>
</body>
</html>
